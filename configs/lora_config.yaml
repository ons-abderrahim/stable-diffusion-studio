# configs/lora_config.yaml

model:
  id: stabilityai/stable-diffusion-xl-base-1.0

lora:
  rank: 16
  alpha: 16
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0
    - ff.net.0.proj
    - ff.net.2

data:
  dataset_dir: data/lora_style/
  resolution: 512

training:
  output_dir: checkpoints/lora/
  num_train_epochs: 10
  max_train_steps: null
  train_batch_size: 2
  gradient_accumulation_steps: 1
  save_steps: 500

  learning_rate: 1.0e-4
  lr_scheduler: cosine
  lr_warmup_steps: 100

  mixed_precision: fp16
  seed: 42
